# Erebos Docker Compose — batteries-included pentest toolkit.
#
# Modes:
#   docker compose up                              → MCP SSE server on :8443
#   docker compose run --rm erebos scan <target>  → one-shot scan
#   docker compose run --rm erebos engage <target> → full engagement
#   docker compose up erebos-mcp                  → lightweight MCP-only image
#
# Security notes:
# - cap_drop ALL; NET_RAW added back only for nmap SYN scans
# - Non-root user (erebos, UID 1000)
# - /data mounted for persistent scan output
# - Secrets via /run/secrets (Docker Secrets)

services:
  # ── Full pentest image (default) ───────────────────────────────────
  erebos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erebos
    restart: unless-stopped

    # Default command: MCP server. Override for scans:
    #   docker compose run --rm erebos scan <target> --phase recon
    command: ["mcp-serve", "--port", "8443"]

    ports:
      - "0.0.0.0:8443:8443"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW   # Required for nmap SYN scans

    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=128m

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - erebos-net

    environment:
      - EREBOS_SSE_HOST=0.0.0.0
      - EREBOS_SSE_PORT=8443
      - EREBOS_MCP_TOKEN_FILE=/run/secrets/mcp_token
      - EREBOS_HMAC_SECRET_FILE=/run/secrets/hmac_secret
      - EREBOS_STORAGE_DIR=/data/scans

    dns:
      - 8.8.8.8
      - 1.1.1.1

    secrets:
      - mcp_token
      - hmac_secret

  # ── Lightweight MCP-only image ─────────────────────────────────────
  erebos-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: erebos-mcp
    restart: unless-stopped
    profiles:
      - mcp-only

    ports:
      - "127.0.0.1:8444:8443"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    volumes:
      - erebos-data:/data:noexec
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    networks:
      - erebos-net

    environment:
      - EREBOS_SSE_HOST=0.0.0.0
      - EREBOS_SSE_PORT=8443
      - EREBOS_MCP_TOKEN_FILE=/run/secrets/mcp_token
      - EREBOS_HMAC_SECRET_FILE=/run/secrets/hmac_secret

    secrets:
      - mcp_token
      - hmac_secret

networks:
  erebos-net:
    driver: bridge
    # Set internal: true to block egress; false to allow scanning targets
    internal: false

secrets:
  mcp_token:
    file: ./secrets/mcp_token.txt
  hmac_secret:
    file: ./secrets/hmac_secret.txt

volumes:
  erebos-data:
    driver: local
