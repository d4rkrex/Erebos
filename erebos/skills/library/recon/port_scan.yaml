name: port_scan
version: "1.0"
description: "TCP/UDP port scanning via nmap"
technique_id: T1046
phase_applicable: [recon]
triggers:
  - observation_type: target_added
    field_match: {}
tools_required: [nmap]
actions:
  - tool: nmap
    args_template: ["-sV", "-sC", "--top-ports", "1000", "{target}"]
    description: "Top 1000 ports with version detection"
  - tool: nmap
    args_template: ["-sU", "--top-ports", "100", "{target}"]
    description: "Top 100 UDP ports"
