[tool.poetry]
name = "erebos"
version = "1.0.0"
description = "Erebos — Autonomous pentest orchestration with multi-agent fleet mode and MCP integration"
authors = ["d4rkrex"]
readme = "README.md"
packages = [{include = "erebos"}]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
rich = "^13.7.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.1"
python-ulid = "^3.0.0"
jinja2 = "^3.1.3"
python-dotenv = "^1.0.0"
networkx = ">=3.0"
requests = "^2.31.0"
httpx = "^0.27.0"
textual = "^0.52.0"
starlette = ">=0.37"
uvicorn = ">=0.29"
sse-starlette = ">=1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
textual = "^0.52.0"
respx = "^0.23.1"

[tool.poetry.scripts]
erebos = "erebos.cli.main:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
